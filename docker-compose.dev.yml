# Development-specific configuration
# Use: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: maestro-backend-dev
    volumes:
      # Mount source code for hot reload (read-write so dotnet can create build artifacts)
      - ./backend/src:/app/src:rw
      # Mount blocks directories (read-write)
      - ./blocks:/app/blocks:rw
      - ./.maestro:/app/.maestro:rw
      # Mount repository docs so schema validator can find docs/schemas
      - ./docs:/app/docs:ro
      - ${HOME}/.maestro/blocks:/root/.maestro/blocks:ro
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_WATCH_RESTART_ON_RUDE_EDIT=1
      - DOTNET_USE_POLLING_FILE_WATCHER=true
      - LLM__DefaultProvider=${LLM_DEFAULT_PROVIDER:-OpenAI}
      - LLM__Providers__OpenAI__ApiKey=${OPENAI_API_KEY:-}
      - LLM__Providers__Anthropic__ApiKey=${ANTHROPIC_API_KEY:-}
      - LLM__Providers__Ollama__BaseUrl=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    # Override health check for faster startup in development
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/discovery/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Optional: Frontend development server
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      target: development
    container_name: maestro-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      # Mount source for hot reload
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - ./frontend/index.html:/app/index.html:ro
      # Mount project config so Vite can import maestro.config.json
      - ./maestro.config.json:/app/maestro.config.json:ro
      # Vite in this project resolves '../../../maestro.config.json' from src/config
      # which evaluates to /maestro.config.json inside the container, so mount there too
      - ./maestro.config.json:/maestro.config.json:ro
      # Don't mount node_modules (use container's)
      - /app/node_modules
    environment:
      - VITE_USE_MOCK_BACKEND=false
      - VITE_API_BASE_URL=http://localhost:5000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - maestro-network

networks:
  maestro-network:
    name: maestro-network
    driver: bridge
