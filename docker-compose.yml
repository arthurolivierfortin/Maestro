version: '3.8'

services:
  # Backend API service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maestro-backend
    ports:
      - "5000:5000"
    volumes:
      # Mount blocks directories (read-write)
      - ./blocks:/app/blocks:rw
      - ./.maestro:/app/.maestro:rw
      # Optionally mount user blocks from host (read-only for safety)
      - ${HOME}/.maestro/blocks:/root/.maestro/blocks:ro
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:5000
      - LLM__DefaultProvider=${LLM_DEFAULT_PROVIDER:-OpenAI}
      - LLM__Providers__OpenAI__ApiKey=${OPENAI_API_KEY:-}
      - LLM__Providers__Anthropic__ApiKey=${ANTHROPIC_API_KEY:-}
      - LLM__Providers__Ollama__BaseUrl=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - Blocks__SearchPaths__0=/app/blocks
      - Blocks__SearchPaths__1=/app/.maestro/blocks
      - Blocks__SearchPaths__2=/root/.maestro/blocks
      - Cors__AllowedOrigins=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/discovery/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - maestro-network

networks:
  maestro-network:
    name: maestro-network
    driver: bridge
